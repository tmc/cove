version: 2

project_name: cove
dist: .release-dist

builds:
  - id: cove
    main: ./cmd/cove
    binary: cove
    goos:
      - darwin
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

  - id: vz-agent
    main: ./cmd/vz-agent
    binary: vz-agent
    goos:
      - darwin
      - linux
    goarch:
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}

# Signing and notarization happen outside goreleaser — see
# scripts/release-local.sh and docs/release-pipeline.md. goreleaser is used
# here only for build + archive + checksum, both in `make release-check`
# (snapshot dry-run) and from inside scripts/release-local.sh before the
# manual codesign / notarytool / stapler pass.

archives:
  - id: cove
    ids:
      - cove
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - cmd/cove/vz.entitlements
      - LICENSE*
      - README*

  - id: vz-agent
    ids:
      - vz-agent
    name_template: "vz-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE*

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: tmc
    name: cove
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
  header: |
    ## cove {{ .Tag }}

    Manage macOS and Linux VMs with Apple Virtualization and Windows ARM64 VMs with QEMU/HVF.

    ### Installation

    ```bash
    # Via Homebrew
    brew install tmc/tap/cove

    # Or download the signed + notarized DMG
    # (drag cove onto /usr/local/bin)
    open cove-{{ .Version }}.dmg

    # Or extract the tar.gz
    tar xzf cove_{{ .Version }}_darwin_arm64.tar.gz
    sudo install cove /usr/local/bin/
    ```

    ### Requirements
    - Apple Silicon Mac (arm64)
    - macOS 14.0+ (Sonoma or later)
    - Windows guests only: `brew install qemu` (the QEMU/HVF backend runs
      `qemu-system-aarch64` and `qemu-img` and uses that formula's EDK2
      firmware). Verify with `cove doctor qemu`.
  footer: |
    **Full Changelog**: https://github.com/tmc/cove/compare/{{ .PreviousTag }}...{{ .Tag }}
